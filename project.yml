name: bestWaiting
options:
  bundleIdPrefix: com.scinttt
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

packages:
  OpenAI:
    url: https://github.com/MacPaw/OpenAI.git
    branch: main

targets:
  bestWaiting:
    type: application
    platform: macOS
    dependencies:
      - package: OpenAI
    sources:
      - path: Sources/bestWaiting
      - path: Resources
    info:
      path: Sources/bestWaiting/Info.plist
      properties:
        NSMicrophoneUsageDescription: "bestWaiting needs microphone access to record your voice for speech-to-text transcription."
        LSUIElement: true
    entitlements:
      path: Sources/bestWaiting/bestWaiting.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scinttt.open-typeless
        PRODUCT_NAME: bestWaiting
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"

  bestWaitingTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/bestWaitingTests
    dependencies:
      - target: bestWaiting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scinttt.open-typeless-tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  bestWaiting:
    build:
      targets:
        bestWaiting: all
        bestWaitingTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - bestWaitingTests
